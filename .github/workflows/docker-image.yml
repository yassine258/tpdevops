name: Build, Test & Push (Docker Compose)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Values for the ${...} placeholders in docker-compose.yml.
  # Override them in repo Settings → Secrets and variables → Actions → Variables.
  APP_PORT: ${{ vars.APP_PORT || '8080' }}
  WEB_PORTS: ${{ vars.WEB_PORTS || '8080' }}
  REDIS_IMAGE: ${{ vars.REDIS_IMAGE || 'redis:7-alpine' }}
  LOCAL_IMAGE: counter-app:1.0                 # must match "image:" in compose
  HUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/counter-app

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------- 1. Java build + unit tests ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & unit tests
        run: mvn -B -ntp clean verify

      # ---------- 2. Build images with compose ----------
      - name: Write .env for compose
        run: |
          cat > .env <<EOF
          APP_PORT=${APP_PORT}
          WEB_PORTS=${WEB_PORTS}
          REDIS_IMAGE=${REDIS_IMAGE}
          EOF

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      # ---------- 3. Integration test: app + Redis together ----------
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120 db-service && docker compose up -d web

      - name: Smoke test web service
        run: |
          URL="http://localhost:${WEB_PORTS}/"
          for i in $(seq 1 30); do
            if curl -fsS "$URL" -o /tmp/r1; then
              echo "App is up"; break
            fi
            echo "Waiting for app ($i/30)..."; sleep 2
          done
          curl -fsS "$URL" -o /tmp/r1
          curl -fsS "$URL" -o /tmp/r2
          echo "Response 1: $(cat /tmp/r1)"
          echo "Response 2: $(cat /tmp/r2)"
          # Counter should change between calls (proves Redis is wired up)
          if cmp -s /tmp/r1 /tmp/r2; then
            echo "::warning::Responses identical — counter may not be incrementing"
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

      # ---------- 4. Push to Docker Hub (not on PRs) ----------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag & push
        if: github.event_name != 'pull_request'
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          TAGS="1.0 latest ${SHA_TAG}"
          # On a git tag like v1.2.3, also push 1.2.3
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="$TAGS ${GITHUB_REF_NAME#v}"
          fi
          for t in $TAGS; do
            docker tag "$LOCAL_IMAGE" "$HUB_IMAGE:$t"
            docker push "$HUB_IMAGE:$t"
          done
